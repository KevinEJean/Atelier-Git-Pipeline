name: Compilation du projet Maven

# Only executes when pushing from main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ordre des exécutions
jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java SDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Frournire acces au runner
        run: chmod +x mvnw
      - name: Compiler et tester le projet Maven
        run: ./mvnw clean test
      - name: Publier le rapport de tests
        uses: actions/upload-artifact@v5
        with:
          name: rapport-jacoco
          path: target/site/jacoco/index.html
name: Compilation du projet Maven

# Only executes when pushing from main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Ordre des exécutions
jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java SDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - name: Frournire acces au runner
        run: chmod +x mvnw
      - name: Tester le projet Maven
        run: ./mvnw test
      - name: Compilation du projet Maven
        run: ./mvnw compile
name: Compilation du projet Maven

# Only executes when pushing from main
on:
  push:
    branches: [ main ]

# Ordre des exécutions
jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java SDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
      - name: Frournire acces au runner
        run: chmod +x mvnw
      - name: Compilation du projet Maven
        run: mvnw compile